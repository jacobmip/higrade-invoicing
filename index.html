<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0a1628" />
    <title>HI Grade Plumbing – Invoicing</title>
    <!-- Vite builds with base='./' so the bundle works under capacitor:// (iOS).
         On the web that breaks nested paths like /v/<token> because the script
         resolves to /v/assets/index.js (404). Inject <base href="/"> at runtime
         when we detect an http(s) origin so absolute asset paths win. -->
    <script>
      if (location.protocol === 'http:' || location.protocol === 'https:') {
        var b = document.createElement('base');
        b.href = '/';
        document.head.appendChild(b);
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        background: #f4f6fa;
        -webkit-tap-highlight-color: transparent;
        width: 100%;
        max-width: 100vw;
        overscroll-behavior-y: none;
        -webkit-overflow-scrolling: touch;
        touch-action: pan-y;
      }
      /* NOTE: do NOT set overflow-x:hidden on html/body/#root — it breaks
         position:sticky on descendants in iOS Safari. The app shell already
         clamps width with max-width: 480px, so horizontal scroll cannot occur. */
      html { height: -webkit-fill-available; }
      body { min-height: 100vh; min-height: -webkit-fill-available; }
      #root { width: 100%; max-width: 100vw; }
      /* Disable iOS pull-to-refresh & rubber-banding side scroll */
      body { position: relative; }

      @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

      /* Strip the iOS "cancel" X and pill rounding from chat search inputs */
      input[type="search"]::-webkit-search-decoration,
      input[type="search"]::-webkit-search-cancel-button,
      input[type="search"]::-webkit-search-results-button,
      input[type="search"]::-webkit-search-results-decoration { -webkit-appearance: none; appearance: none; display: none; }
      input[type="search"] { -webkit-appearance: none; appearance: none; }

      /* Print styles — used by the "Print / PDF" button. We hide everything
         except elements marked with .print-area, which is the PDFPreview. */
      @media print {
        @page { margin: 12mm; }
        html, body { background: #fff !important; overflow: visible !important; height: auto !important; max-width: none !important; }
        body * { visibility: hidden; }
        .print-area, .print-area * { visibility: visible !important; }
        .print-area { position: absolute; left: 0; top: 0; width: 100%; box-shadow: none !important; padding: 0 !important; }
        .no-print { display: none !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
