<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HI Grade" />
    <meta name="theme-color" content="#0a1628" />
    <link rel="manifest" href="/manifest.json" />
    <title>HI Grade Plumbing – Invoicing</title>
    <!-- Vite builds with base='./' so the bundle works under capacitor:// (iOS).
         On the web that breaks nested paths like /v/<token> because the script
         resolves to /v/assets/index.js (404). Inject <base href="/"> at runtime
         when we detect an http(s) origin so absolute asset paths win. -->
    <script>
      if (location.protocol === 'http:' || location.protocol === 'https:') {
        var b = document.createElement('base');
        b.href = '/';
        document.head.appendChild(b);
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      /* Force every native element (buttons, inputs, textareas, selects) to
         use Barlow so the app looks consistent across iOS / Mac / Windows.
         Without this, browsers fall back to system UI fonts on form controls
         which clashes with the Barlow body text. */
      html, body, button, input, select, textarea, optgroup {
        font-family: 'Barlow', system-ui, -apple-system, sans-serif;
      }
      html, body {
        background: #f4f6fa;
        -webkit-tap-highlight-color: transparent;
        width: 100%;
        max-width: 100vw;
        overscroll-behavior-y: none;
        -webkit-overflow-scrolling: touch;
        touch-action: pan-y;
      }
      /* NOTE: do NOT set overflow-x:hidden on html/body/#root — it breaks
         position:sticky on descendants in iOS Safari. The app shell already
         clamps width with max-width: 480px, so horizontal scroll cannot occur. */
      html { height: -webkit-fill-available; height: 100dvh; }
      body { min-height: 100vh; min-height: 100dvh; }
      #root { width: 100%; max-width: 100vw; }
      /* Disable iOS pull-to-refresh & rubber-banding side scroll */
      body { position: relative; }

      @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

      /* iOS Safari sets min-width: -webkit-min-content on <input type="date">
         and <input type="time">, which overrides flex/grid 1fr columns and
         pushes the right cell off the edge of the screen. Force inputs to
         shrink to their parent. */
      input, select, textarea { min-width: 0; max-width: 100%; box-sizing: border-box; }

      /* iOS Safari ignores width:100% / min-width:0 on native date/time pickers
         because their intrinsic content size (the formatted date string)
         takes precedence. Stripping appearance and forcing display:block lets
         them shrink and fill the parent column instead of overflowing. */
      input[type="date"], input[type="time"], input[type="datetime-local"], input[type="month"], input[type="week"] {
        -webkit-appearance: none;
        appearance: none;
        display: block;
        width: 100%;
        min-width: 0;
      }

      /* Strip the iOS "cancel" X and pill rounding from chat search inputs */
      input[type="search"]::-webkit-search-decoration,
      input[type="search"]::-webkit-search-cancel-button,
      input[type="search"]::-webkit-search-results-button,
      input[type="search"]::-webkit-search-results-decoration { -webkit-appearance: none; appearance: none; display: none; }
      input[type="search"] { -webkit-appearance: none; appearance: none; }

      /* Print styles — used by the "Print / PDF" button. We hide everything
         except elements marked with .print-area, which is the PDFPreview. */
      @media print {
        @page { margin: 12mm; }
        html, body { background: #fff !important; overflow: visible !important; height: auto !important; max-width: none !important; }
        body * { visibility: hidden; }
        .print-area, .print-area * { visibility: visible !important; }
        .print-area { position: absolute; left: 0; top: 0; width: 100%; box-shadow: none !important; padding: 0 !important; }
        .no-print { display: none !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
