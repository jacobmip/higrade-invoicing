<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0a1628" />
    <title>HI Grade Plumbing – Invoicing</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        background: #f4f6fa;
        -webkit-tap-highlight-color: transparent;
        width: 100%;
        max-width: 100vw;
        overflow-x: hidden;
        overscroll-behavior-y: none;
        -webkit-overflow-scrolling: touch;
        touch-action: pan-y;
      }
      html { height: -webkit-fill-available; }
      body { min-height: 100vh; min-height: -webkit-fill-available; }
      #root { width: 100%; max-width: 100vw; overflow-x: hidden; }
      /* Disable iOS pull-to-refresh & rubber-banding side scroll */
      body { position: relative; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
