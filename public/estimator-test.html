<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HI Grade — AI Estimator Test Harness</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f5f6f8; color: #1a1a1a;
    margin: 0; padding: 24px; max-width: 900px; margin-left: auto; margin-right: auto;
  }
  h1 { font-size: 22px; margin: 0 0 4px 0; }
  .sub { color: #666; font-size: 13px; margin-bottom: 20px; }
  textarea {
    width: 100%; min-height: 120px; padding: 12px; font-size: 15px;
    border: 1px solid #d0d3d8; border-radius: 8px; font-family: inherit;
    resize: vertical;
  }
  .row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  button {
    background: #0066cc; color: white; border: none; padding: 10px 18px;
    border-radius: 8px; font-size: 15px; cursor: pointer; font-weight: 500;
  }
  button:hover { background: #0052a3; }
  button:disabled { background: #999; cursor: not-allowed; }
  button.secondary { background: #e8eaed; color: #1a1a1a; }
  button.secondary:hover { background: #d8dade; }
  .preset { font-size: 12px; padding: 6px 10px; background: #fff; border: 1px solid #d0d3d8; color: #333; }
  .preset:hover { background: #eef; }
  .card {
    background: white; border: 1px solid #e0e3e8; border-radius: 10px;
    padding: 16px; margin-top: 16px;
  }
  .card h3 { margin: 0 0 12px 0; font-size: 16px; }
  .item {
    border-left: 3px solid #0066cc; padding: 8px 12px; margin-bottom: 10px;
    background: #f8f9fb; border-radius: 4px;
  }
  .item .name { font-weight: 600; font-size: 15px; }
  .item .price { float: right; font-weight: 600; color: #0a7a35; }
  .item .desc {
    margin-top: 6px; font-size: 13px; color: #444; white-space: pre-wrap;
    line-height: 1.5;
  }
  .block { margin-top: 12px; }
  .block .label {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px;
    color: #666; font-weight: 600; margin-bottom: 4px;
  }
  .block ul { margin: 0; padding-left: 18px; font-size: 13px; }
  .summary { font-style: italic; color: #555; font-size: 13px; }
  .total {
    text-align: right; font-size: 18px; font-weight: 600;
    margin-top: 12px; padding-top: 12px; border-top: 1px solid #e0e3e8;
  }
  .total .gross { color: #999; font-size: 13px; font-weight: 400; margin-right: 8px; }
  .raw {
    background: #1e1e1e; color: #d4d4d4; padding: 12px; border-radius: 6px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px;
    white-space: pre-wrap; word-break: break-word; max-height: 320px; overflow: auto;
  }
  .pill {
    display: inline-block; background: #eef; color: #335;
    padding: 2px 8px; border-radius: 10px; font-size: 11px; margin-right: 4px;
  }
  .citation { font-size: 12px; margin-bottom: 4px; }
  .citation a { color: #0066cc; text-decoration: none; }
  .err {
    background: #fdecea; border: 1px solid #f5b3ab; color: #9b1d18;
    padding: 12px; border-radius: 8px; margin-top: 12px;
  }
  .spinner {
    display: inline-block; width: 14px; height: 14px;
    border: 2px solid #fff; border-top-color: transparent; border-radius: 50%;
    animation: spin 0.7s linear infinite; vertical-align: middle; margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .meta { font-size: 11px; color: #888; margin-top: 6px; }
  #thumbs { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .thumb {
    position: relative; width: 80px; height: 80px; border-radius: 8px;
    background-size: cover; background-position: center; border: 1px solid #d0d3d8;
  }
  .thumb .x {
    position: absolute; top: -6px; right: -6px; background: #c33; color: white;
    border: none; border-radius: 50%; width: 22px; height: 22px; cursor: pointer;
    font-size: 14px; line-height: 1; padding: 0;
  }
  .thumb-warn {
    font-size: 11px; color: #b86a00; margin-top: 4px; flex-basis: 100%;
  }
  .tabs { display: flex; gap: 4px; margin: 8px 0 16px; border-bottom: 1px solid #d0d3d8; }
  .tab {
    background: transparent; color: #555; border: none; padding: 10px 16px;
    font-size: 14px; cursor: pointer; border-bottom: 3px solid transparent;
    margin-bottom: -1px; font-weight: 500; border-radius: 0;
  }
  .tab.active { color: #0066cc; border-bottom-color: #0066cc; }
  .tab:hover:not(.active) { color: #1a1a1a; }
  .tabpanel { display: none; }
  .tabpanel.active { display: block; }
  .field {
    display: flex; align-items: baseline; padding: 6px 0;
    border-bottom: 1px solid #f0f2f5; font-size: 14px;
  }
  .field .key { width: 90px; color: #888; font-size: 12px; text-transform: uppercase; }
  .field .val { flex: 1; }
  .field .val.empty { color: #aaa; font-style: italic; }
  .conf-high { color: #0a7a35; }
  .conf-medium { color: #b86a00; }
  .conf-low { color: #c33; }
</style>
</head>
<body>
  <h1>AI — Test Harness</h1>
  <div class="sub">Sonnet 4.6 + vision + web search · Option B markup · Jake's voice.</div>

  <div class="tabs">
    <button class="tab active" data-tab="estimator">Estimator</button>
    <button class="tab" data-tab="client">Client Extractor</button>
  </div>

  <div id="tab-estimator" class="tabpanel active">

  <div class="sub" style="margin-top:0;">Throw real plumbing jobs at it. Add photos for visual context.</div>

  <textarea id="job" placeholder="Paste a real job description... e.g., '50 gallon electric water heater replacement in Hawaii Kai, customer wants standard, no permit'"></textarea>

  <div id="thumbs"></div>

  <div class="row">
    <button id="go">Generate Estimate</button>
    <button class="secondary" id="attach">📎 Add Photos</button>
    <button class="secondary" id="clear">Clear</button>
    <input type="file" id="file" accept="image/*" multiple style="display:none" />
  </div>

  <div class="row" style="margin-top: 8px;">
    <button class="preset">50 gal electric water heater replacement, Hawaii Kai</button>
    <button class="preset">Moen single-handle kitchen faucet leaking from base</button>
    <button class="preset">Toilet running constantly + bath sink slow drain + corroded showerhead</button>
    <button class="preset">Customer-supplied Toto washlet bidet install, GFCI already present</button>
    <button class="preset">Tankless water heater install, replacing 40 gal electric tank, Kailua</button>
    <button class="preset">Whole-house repipe estimate, single-story 3BR Manoa, copper to PEX</button>
  </div>

  <div id="result"></div>
  </div><!-- /tab-estimator -->

  <div id="tab-client" class="tabpanel">
    <div class="sub" style="margin-top:0;">Drop a screenshot of a contact card, text thread, business card, or email signature.</div>

    <textarea id="clientCtx" placeholder="(Optional) Extra context: 'this is a property manager from Kakaako'..." style="min-height:60px;"></textarea>

    <div id="clientThumbs"></div>

    <div class="row">
      <button id="clientGo">Extract Client Info</button>
      <button class="secondary" id="clientAttach">📎 Add Screenshots</button>
      <button class="secondary" id="clientClear">Clear</button>
      <input type="file" id="clientFile" accept="image/*" multiple style="display:none" />
    </div>

    <div id="clientResult"></div>
  </div><!-- /tab-client -->

<script>
const $ = id => document.getElementById(id);
const go = $('go');

// ===== Tab switching =====
document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    document.querySelectorAll('.tabpanel').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    document.getElementById('tab-' + t.dataset.tab).classList.add('active');
  });
});

document.querySelectorAll('.preset').forEach(btn => {
  btn.addEventListener('click', () => { $('job').value = btn.textContent; });
});

$('clear').addEventListener('click', () => {
  $('job').value = '';
  $('result').innerHTML = '';
  photos.length = 0;
  renderThumbs();
});

// ===== Photo handling =====
const photos = []; // array of { dataUrl, name }

$('attach').addEventListener('click', () => $('file').click());
$('file').addEventListener('change', async e => {
  const files = Array.from(e.target.files || []);
  for (const f of files) {
    const dataUrl = await resizeImage(f, 1600, 0.82);
    photos.push({ dataUrl, name: f.name });
  }
  e.target.value = '';
  renderThumbs();
});

function renderThumbs() {
  const el = $('thumbs');
  el.innerHTML = photos.map((p, i) =>
    `<div class="thumb" style="background-image:url('${p.dataUrl}')">
       <button class="x" data-i="${i}">×</button>
     </div>`
  ).join('');
  if (photos.length >= 5) {
    el.innerHTML += `<div class="thumb-warn">${photos.length} photos attached — each adds ~2-3 sec and ~1500 tokens.</div>`;
  }
  el.querySelectorAll('.x').forEach(btn => {
    btn.addEventListener('click', () => {
      photos.splice(Number(btn.dataset.i), 1);
      renderThumbs();
    });
  });
}

function resizeImage(file, maxDim, quality) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onload = () => { img.src = reader.result; };
    reader.onerror = reject;
    img.onload = () => {
      let { width, height } = img;
      if (width > maxDim || height > maxDim) {
        const scale = maxDim / Math.max(width, height);
        width = Math.round(width * scale);
        height = Math.round(height * scale);
      }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = reject;
    reader.readAsDataURL(file);
  });
}

go.addEventListener('click', async () => {
  const job = $('job').value.trim();
  if (!job && photos.length === 0) return;
  go.disabled = true;
  go.innerHTML = '<span class="spinner"></span>Thinking...';
  $('result').innerHTML = '';

  const t0 = Date.now();
  try {
    const r = await fetch('/api/ai-estimator', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        jobDescription: job,
        images: photos.map(p => p.dataUrl),
      }),
    });
    const data = await r.json();
    const elapsed = ((Date.now() - t0) / 1000).toFixed(1);
    render(data, elapsed);
  } catch (e) {
    $('result').innerHTML = `<div class="err">Request failed: ${e.message}</div>`;
  } finally {
    go.disabled = false;
    go.textContent = 'Generate Estimate';
  }
});

function render(data, elapsed) {
  if (data.error) {
    $('result').innerHTML = `<div class="err"><strong>Error:</strong> ${data.error}<br><pre>${data.detail || ''}</pre></div>`;
    return;
  }

  const est = data.estimate;
  let html = '';

  if (est && est.action === 'clarify') {
    html += `<div class="card"><h3>Needs clarification</h3>
      <div>${escapeHtml(est.question || '')}</div>
      <div class="row" style="margin-top:10px;">${
        (est.options || []).map(o => `<button class="preset">${escapeHtml(o)}</button>`).join('')
      }</div></div>`;
  } else if (est && est.items) {
    const subtotal = est.items.reduce((s, it) => s + (Number(it.price) || 0) * (Number(it.qty) || 1), 0);
    const tax = subtotal * 0.04712;
    const grand = subtotal + tax;

    html += `<div class="card"><h3>Estimate Preview</h3>`;
    for (const it of est.items) {
      html += `<div class="item">
        <span class="price">$${Number(it.price).toFixed(2)}${it.qty > 1 ? ' × ' + it.qty : ''}</span>
        <div class="name">${escapeHtml(it.name || '')}</div>
        <div class="desc">${escapeHtml(it.desc || '')}</div>
      </div>`;
    }
    if (est.assumptions && est.assumptions.length) {
      html += `<div class="block"><div class="label">Assumptions</div>
        <ul>${est.assumptions.map(a => `<li>${escapeHtml(a)}</li>`).join('')}</ul></div>`;
    }
    if (est.sources && est.sources.length) {
      html += `<div class="block"><div class="label">Sources</div>
        <ul>${est.sources.map(s => `<li>${escapeHtml(s)}</li>`).join('')}</ul></div>`;
    }
    if (est.summary) {
      html += `<div class="block"><div class="label">Summary</div>
        <div class="summary">${escapeHtml(est.summary)}</div></div>`;
    }
    html += `<div class="total">
      <span class="gross">Subtotal $${subtotal.toFixed(2)} · GET $${tax.toFixed(2)}</span>
      Total $${grand.toFixed(2)}</div></div>`;
  } else {
    html += `<div class="err">Could not parse JSON estimate from model.<br>Showing raw text below.</div>`;
  }

  // Citations
  if (data.citations && data.citations.length) {
    html += `<div class="card"><h3>Web search results used</h3>`;
    for (const c of data.citations) {
      html += `<div class="citation">• <a href="${escapeAttr(c.url)}" target="_blank">${escapeHtml(c.title || c.url)}</a></div>`;
    }
    html += `</div>`;
  }

  // Meta
  const usage = data.usage || {};
  const tokens = (usage.input_tokens || 0) + (usage.output_tokens || 0);
  const searches = usage.server_tool_use?.web_search_requests || 0;
  html += `<div class="meta">
    <span class="pill">${elapsed}s</span>
    <span class="pill">${tokens} tokens</span>
    <span class="pill">${searches} web searches</span>
    <span class="pill">stop: ${data.stop_reason || 'n/a'}</span>
  </div>`;

  // Raw
  html += `<div class="card"><h3>Raw model output</h3>
    <div class="raw">${escapeHtml(data.raw_text || '')}</div></div>`;

  $('result').innerHTML = html;
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s).replace(/"/g, '&quot;'); }

// ===== Client extractor tab =====
const clientPhotos = [];
$('clientAttach').addEventListener('click', () => $('clientFile').click());
$('clientFile').addEventListener('change', async e => {
  const files = Array.from(e.target.files || []);
  for (const f of files) {
    const dataUrl = await resizeImage(f, 1600, 0.85);
    clientPhotos.push({ dataUrl, name: f.name });
  }
  e.target.value = '';
  renderClientThumbs();
});
$('clientClear').addEventListener('click', () => {
  $('clientCtx').value = '';
  $('clientResult').innerHTML = '';
  clientPhotos.length = 0;
  renderClientThumbs();
});
function renderClientThumbs() {
  const el = $('clientThumbs');
  el.innerHTML = clientPhotos.map((p, i) =>
    `<div class="thumb" style="background-image:url('${p.dataUrl}')">
       <button class="x" data-i="${i}">×</button>
     </div>`
  ).join('');
  el.querySelectorAll('.x').forEach(btn => {
    btn.addEventListener('click', () => {
      clientPhotos.splice(Number(btn.dataset.i), 1);
      renderClientThumbs();
    });
  });
}
$('clientGo').addEventListener('click', async () => {
  if (!clientPhotos.length) {
    $('clientResult').innerHTML = '<div class="err">Add at least one screenshot first.</div>';
    return;
  }
  const btn = $('clientGo');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Reading...';
  $('clientResult').innerHTML = '';
  const t0 = Date.now();
  try {
    const r = await fetch('/api/ai-extract-client', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        images: clientPhotos.map(p => p.dataUrl),
        extraContext: $('clientCtx').value.trim(),
      }),
    });
    const data = await r.json();
    renderClient(data, ((Date.now() - t0) / 1000).toFixed(1));
  } catch (e) {
    $('clientResult').innerHTML = `<div class="err">Request failed: ${e.message}</div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = 'Extract Client Info';
  }
});
function renderClient(data, elapsed) {
  if (data.error) {
    $('clientResult').innerHTML = `<div class="err">Error: ${escapeHtml(data.error)}<pre>${escapeHtml(data.detail || '')}</pre></div>`;
    return;
  }
  const r = data.result || {};
  let html = '';
  if (r.action === 'no_contact_info' || r.action === 'unreadable') {
    html += `<div class="err">${escapeHtml(r.message || 'Could not extract.')}</div>`;
  } else if (r.action === 'extracted' && r.client) {
    const c = r.client;
    const fld = (k, v) => `<div class="field"><div class="key">${k}</div><div class="val${v ? '' : ' empty'}">${v ? escapeHtml(v) : 'not found'}</div></div>`;
    html += `<div class="card"><h3>Extracted Client — confidence <span class="conf-${r.confidence || 'low'}">${escapeHtml(r.confidence || '?')}</span></h3>`;
    html += fld('Name', c.name);
    html += fld('Phone', c.phone);
    html += fld('Email', c.email);
    html += fld('Company', c.company);
    const a = c.address || {};
    const addr = [a.line1, a.line2, a.line3].filter(Boolean).join(' · ');
    html += fld('Address', addr);
    html += fld('Notes', c.notes);
    html += `<div class="row" style="margin-top:14px;">
      <button>Create Client</button>
      <button class="secondary">Edit</button>
      <button class="secondary">Cancel</button>
    </div>`;
    if (r.concerns && r.concerns.length) {
      html += `<div class="block"><div class="label">Concerns</div><ul>${r.concerns.map(c => `<li>${escapeHtml(c)}</li>`).join('')}</ul></div>`;
    }
    html += `</div>`;
  } else {
    html += `<div class="err">Could not parse JSON. Raw text below.</div>`;
  }
  const usage = data.usage || {};
  const tokens = (usage.input_tokens || 0) + (usage.output_tokens || 0);
  html += `<div class="meta"><span class="pill">${elapsed}s</span><span class="pill">${tokens} tokens</span></div>`;
  html += `<div class="card"><h3>Raw model output</h3><div class="raw">${escapeHtml(data.raw_text || '')}</div></div>`;
  $('clientResult').innerHTML = html;
}
</script>
</body>
</html>
